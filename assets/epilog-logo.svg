<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Variables CSS modifiables à la volée */
    :root {
      --bg-color: #0F172A;
      --shield-bg: #1E293B;
      --shield-stroke: #334155;
      
      --carabiner-color: #0EA5E9;
      --carabiner-gate: #E2E8F0;
      --carabiner-lock: #F97316;
      
      --spruce-dark: #047857;
      --spruce-mid: #10B981;
      --spruce-light: #34D399;
      --spruce-top: #6EE7B7;
      --spruce-trunk: #78350F;
      
      --text-main: #F8FAFC;
      --text-accent: #38BDF8;
      --text-sub: #94A3B8;
    }

    .bg { fill: var(--bg-color); }
    .shield { fill: var(--shield-bg); stroke: var(--shield-stroke); stroke-width: 3px; }
    
    .carabiner-body { fill: none; stroke: var(--carabiner-color); stroke-width: 28px; stroke-linecap: round; stroke-linejoin: round; }
    .carabiner-gate { fill: var(--carabiner-gate); }
    .carabiner-lock { fill: var(--carabiner-lock); }
    .carabiner-pin { fill: var(--bg-color); }
    .lock-ridge { stroke: #FFFFFF; stroke-width: 2.5px; opacity: 0.6; }
    
    .mountain-bg { fill: #1E293B; opacity: 0.8; }
    .mountain-facet { fill: #475569; opacity: 0.5; }
    .trunk { fill: var(--spruce-trunk); }
    
    .spruce-tier-4 { fill: var(--spruce-dark); }
    .spruce-tier-3 { fill: var(--spruce-mid); }
    .spruce-tier-2 { fill: var(--spruce-light); }
    .spruce-tier-1 { fill: var(--spruce-top); }
    .spruce-highlight { fill: #FFFFFF; opacity: 0.2; }
    
    .title-main { fill: var(--text-main); font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 3px; }
    .title-highlight { fill: var(--text-accent); }
    .title-sub { fill: var(--text-sub); font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2.5px; }
  </style>

  <!-- Fond -->
  <rect class="bg" width="600" height="600" rx="36"/>

  <!-- Bouclier -->
  <path class="shield" d="M 300 50 L 470 105 V 290 C 470 415 300 505 300 505 C 300 505 130 415 130 290 V 105 Z"/>

  <!-- Mousqueton -->
  <g class="carabiner-group">
    <path class="carabiner-body" d="M 235 115 C 345 95, 410 142, 410 225 L 410 355 C 410 438, 325 475, 245 465 C 180 456, 160 410, 160 355 L 160 225 C 160 160, 180 125, 235 115 Z"/>
    <rect class="carabiner-gate" x="397" y="225" width="26" height="130" rx="7" />
    <rect class="carabiner-lock" x="390" y="270" width="40" height="44" rx="8" />
    <line class="lock-ridge" x1="395" y1="281" x2="425" y2="281"/>
    <line class="lock-ridge" x1="395" y1="292" x2="425" y2="292"/>
    <line class="lock-ridge" x1="395" y1="303" x2="425" y2="303"/>
    <circle class="carabiner-pin" cx="410" cy="202" r="6"/>
    <circle class="carabiner-pin" cx="410" cy="385" r="6"/>
  </g>

  <!-- Épicéa & Montagne -->
  <g class="epicea-group">
    <polygon class="mountain-bg" points="180,410 280,270 325,325 370,250 400,410"/>
    <polygon class="mountain-facet" points="280,270 307,307 293,307 370,250 343,325"/>

    <rect class="trunk" x="289" y="380" width="22" height="40" rx="3"/>

    <polygon class="spruce-tier-4" points="300,390 210,390 257,335 233,335 300,270 367,335 343,335 390,390"/>
    <polygon class="spruce-tier-3" points="300,335 230,335 267,288 248,288 300,223 352,288 333,288 370,335"/>
    <polygon class="spruce-tier-2" points="300,280 248,280 277,242 263,242 300,185 337,242 323,242 352,280"/>
    <polygon class="spruce-tier-1" points="300,215 267,215 300,140 333,215"/>

    <polygon class="spruce-highlight" points="300,140 300,215 333,215"/>
    <polygon class="spruce-highlight" points="300,185 300,242 337,242"/>
    <polygon class="spruce-highlight" points="300,223 300,288 352,288"/>
    <polygon class="spruce-highlight" points="300,270 300,335 367,335"/>
  </g>

  <!-- Titre -->
  <g text-anchor="middle">
    <text class="title-main" x="300" y="525">EPI<tspan class="title-highlight">LOG</tspan></text>
    <text class="title-sub" x="300" y="555">GESTION MATÉRIEL MONTAGNE</text>
  </g>
</svg>
